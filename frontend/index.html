<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medicine Expiry Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
  <script defer src="app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial; max-width: 900px; margin: 40px auto; padding: 20px; background: #f0f2f5; }
    h1 { color: #2c3e50; margin-bottom: 5px; }
    h2 { color: #2c3e50; margin: 25px 0 10px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .badge { padding: 6px 15px; border-radius: 20px; font-size: 12px; font-weight: 600; color: white; }
    .network-badge { background: #16a34a; }
    .balance-badge { background: #2563eb; }
    .account-badge { background: #7c3aed; }
    #connectBtn { padding: 10px 20px; background: #3498db; color: white; border: none; cursor: pointer; border-radius: 25px; font-size: 14px; font-weight: bold; }
    #connectBtn:hover { background: #2980b9; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 25px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .stat-card h3 { font-size: 13px; color: #888; margin-bottom: 8px; }
    .stat-card p { font-size: 22px; font-weight: bold; color: #2c3e50; }
    #status { margin: 10px 0; font-weight: bold; font-size: 14px; }
    .input-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    input { padding: 10px; border: 1px solid #ccc; border-radius: 5px; width: 200px; font-size: 14px; }
    .add-btn { padding: 10px 20px; background: #2ecc71; color: white; border: none; cursor: pointer; border-radius: 5px; font-size: 14px; font-weight: bold; }
    .add-btn:hover { background: #27ae60; }
    .refresh-btn { background: #3498db; color: white; border: none; cursor: pointer; border-radius: 5px; padding: 10px 20px; font-size: 14px; margin-bottom: 10px; }
    .refresh-btn:hover { background: #2980b9; }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    th { padding: 12px 15px; background: #2c3e50; color: white; text-align: left; }
    td { padding: 12px 15px; border-bottom: 1px solid #eee; font-size: 14px; }
    .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    .expired { background: #fdecea; }
    .expired .status-badge { background: #e74c3c; color: white; }
    .expiring-soon { background: #fef9e7; }
    .expiring-soon .status-badge { background: #f39c12; color: white; }
    .good { background: #eafaf1; }
    .good .status-badge { background: #2ecc71; color: white; }
    .legend { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 13px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
    .fee-note { font-size: 12px; color: #888; margin-top: 8px; }
  </style>
</head>
<body>

  <div class="top-bar">
    <h1>💊 Medicine Expiry Tracker</h1>
    <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
      <span class="badge network-badge">🔗 Ganache Local</span>
      <span class="badge balance-badge">💰 <span id="contractBalance">0 ETH</span></span>
      <span class="badge account-badge">👤 <span id="account">Not Connected</span></span>
      <button id="connectBtn" onclick="connectWallet()">Connect MetaMask</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card">
      <h3>Total Medicines</h3>
      <p id="totalMedicines">0</p>
    </div>
    <div class="stat-card">
      <h3>Contract Balance</h3>
      <p id="contractBalance2">0 ETH</p>
    </div>
    <div class="stat-card">
      <h3>Fee Per Record</h3>
      <p>0.001 ETH</p>
    </div>
  </div>

  <h2>Add Medicine</h2>
  <div class="input-group">
    <input type="text" id="medicineName" placeholder="Medicine Name" />
    <input type="month" id="expiryDate" />
    <button class="add-btn" onclick="addMedicine()">Add to Blockchain</button>
  </div>
  <p class="fee-note">⚠️ Adding a record costs 0.001 ETH</p>
  <p id="status"></p>

  <h2>All Medicines</h2>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#2ecc71"></div> Good</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f39c12"></div> Expiring within 3 months</div>
    <div class="legend-item"><div class="legend-dot" style="background:#e74c3c"></div> Expired</div>
  </div>
  <button class="refresh-btn" onclick="loadMedicines()">🔄 Refresh List</button>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Expiry Date</th>
        <th>Added By</th>
        <th>Added On</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="medicineList"></tbody>
  </table>

</body>
</html>
